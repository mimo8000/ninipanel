<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ panel_name }} - اضافه کردن کاربر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .sidebar { position: fixed; right: 0; top: 0; bottom: 0; width: 260px; background: #1e293b; padding: 20px; border-left: 1px solid #334155; }
        .sidebar .logo { text-align: center; padding: 20px 0; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .sidebar .logo h2 { color: #a855f7; font-size: 24px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: #94a3b8; text-decoration: none; transition: 0.3s; margin-bottom: 6px; font-size: 15px; }
        .nav-item:hover, .nav-item.active { background: rgba(124,58,237,0.2); color: #a855f7; }
        .main { margin-right: 260px; padding: 30px; }
        .card { background: #1e293b; border-radius: 16px; padding: 30px; border: 1px solid #334155; max-width: 600px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        .form-group input, .form-group select { width: 100%; padding: 14px 16px; border: 1px solid #334155; border-radius: 12px; background: #0f172a; color: #e2e8f0; font-size: 15px; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #7c3aed; box-shadow: 0 0 20px rgba(124,58,237,0.2); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(124,58,237,0.3); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><h2>🛡️ NiniPanel</h2></div>
        <a href="/" class="nav-item"><span>📊</span> داشبورد</a>
        <a href="/clients" class="nav-item"><span>👥</span> کاربران</a>
        <a href="/clients/add" class="nav-item active"><span>➕</span> اضافه کردن</a>
        <a href="/settings" class="nav-item"><span>⚙️</span> تنظیمات</a>
        <a href="/logout" class="nav-item"><span>🚪</span> خروج</a>
    </div>

    <div class="main">
        <h1 style="margin-bottom: 24px;">➕ اضافه کردن کاربر جدید</h1>
        <div class="card">
            <form method="POST">
                <div class="form-group">
                    <label>ایمیل / نام کاربری</label>
                    <input type="email" name="email" placeholder="user@example.com" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>پروتکل</label>
                        <select name="protocol">
                            <option value="vless">VLESS</option>
                            <option value="vmess">VMess</option>
                            <option value="trojan">Trojan</option>
                            <option value="shadowsocks">Shadowsocks</option>
                            <option value="hysteria2">Hysteria2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Inbound</label>
                        <select name="inbound_tag">
                            {% for ib in inbounds %}
                            <option value="{{ ib.tag }}">{{ ib.tag }} ({{ ib.protocol }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>سقف ترافیک (GB)</label>
                        <input type="number" name="total" value="0" min="0" placeholder="0 = نامحدود">
                    </div>
                    <div class="form-group">
                        <label>روز انقضا</label>
                        <input type="number" name="expiry" value="30" min="0" placeholder="0 = نامحدود">
                    </div>
                </div>
                <div class="form-group">
                    <label>محدودیت IP همزمان</label>
                    <input type="number" name="limit_ip" value="2" min="1" max="10">
                </div>
                <div class="form-group">
                    <label>یادداشت (اختیاری)</label>
                    <input type="text" name="note" placeholder="توضیحات...">
                </div>
                <button type="submit" class="btn">✅ ایجاد کاربر</button>
            </form>
        </div>
    </div>
</body>
</html>
